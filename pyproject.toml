[project]
name = "langgraph-currency"
version = "0.1.0"
description = "Kagent 0.9.10 BYO currency agent for Zadig"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "kagent-langgraph", "kagent-core", "langchain-openai>=0.3,<0.4",
  "langgraph>=0.6.5,<0.7", "langchain-core>=0.3,<0.4",
  "httpx>=0.28,<0.29", "uvicorn>=0.30,<1", "a2a-sdk>=0.3.23,<0.4",
]
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "pyyaml>=6,<7"]
[project.scripts]
currency = "currency.cli:main"
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["currency*"]
[tool.setuptools.package-data]
currency = ["agent-card.json"]
[tool.uv.sources]
kagent-core = { workspace = true }
kagent-langgraph = { workspace = true }
[tool.uv.workspace]
members = ["vendor/kagent-core", "vendor/kagent-langgraph"]
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["vendor"]
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
